services:
  main:
    image: public.ecr.aws/b2z8n5q1/hil-bench@sha256:6a50e12eb713d5d21c349ff67a8dbad4d4dc4ad75970726944e534cf506ddeca
    pull_policy: missing
    depends_on:
      ask-human:
        condition: service_healthy
    volumes:
      - ask-human-metrics:/harbor_shared

  ask-human:
    image: public.ecr.aws/b2z8n5q1/hil-bench@sha256:702628a98d6d00f8ee5975d88d91826ca0759f33a7883f55c8bb2483f5205e5b
    pull_policy: missing
    volumes:
      - ${CONTEXT_DIR:-.}/ask-human-data:/ask-human-data:ro
      - ask-human-metrics:/harbor_shared
    environment:
      - BLOCKER_REGISTRY_PATH=/ask-human-data/blocker_registry.json
      - OUTPUT_DIR=/harbor_shared
      - ASK_HUMAN_BACKEND=${ASK_HUMAN_BACKEND:-litellm_proxy}
      - ASK_HUMAN_MODEL=${ASK_HUMAN_MODEL:-openai/gpt-5.6}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
      - LITELLM_USER=${LITELLM_USER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8000),timeout=2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  ask-human-metrics:
