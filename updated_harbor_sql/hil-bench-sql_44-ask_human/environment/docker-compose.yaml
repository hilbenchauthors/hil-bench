services:
  main:
    image: public.ecr.aws/b2z8n5q1/hil-bench@sha256:780e320893bd2386dbf3dcdefe33e1d4b61c54c1eb83c35e8cfe08601d7f023d
    pull_policy: missing
    command: ["main"]
    depends_on:
      sql-tools:
        condition: service_healthy
      business-info:
        condition: service_healthy
      ask-human:
        condition: service_healthy
    volumes:
      - harbor-shared:/harbor_shared
    environment:
      - EXECUTE_SQL_CLIENT_TIMEOUT_SECONDS=1230

  sql-tools:
    image: public.ecr.aws/b2z8n5q1/hil-bench@sha256:780e320893bd2386dbf3dcdefe33e1d4b61c54c1eb83c35e8cfe08601d7f023d
    pull_policy: missing
    command: ["sql-tools"]
    volumes:
      - harbor-shared:/harbor_shared
    environment:
      - DATA_DIR=/data
      - SUBMISSION_FILE=/harbor_shared/submitted_query.sql
      - SQL_QUERY_TIMEOUT_SECONDS=1200
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8000),timeout=2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  business-info:
    image: public.ecr.aws/b2z8n5q1/hil-bench@sha256:780e320893bd2386dbf3dcdefe33e1d4b61c54c1eb83c35e8cfe08601d7f023d
    pull_policy: missing
    command: ["business-info"]
    environment:
      - DATA_DIR=/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8000),timeout=2); s.close()"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 30s

  ask-human:
    image: public.ecr.aws/b2z8n5q1/hil-bench@sha256:404080274967f4d3807ce25566caa5ad0249e5a8046d12c9a48593b2a4b58de5
    pull_policy: missing
    volumes:
      - ${CONTEXT_DIR:-.}/ask-human-data:/ask-human-data:ro
      - harbor-shared:/harbor_shared
    environment:
      - BLOCKER_REGISTRY_PATH=/ask-human-data/blocker_registry.json
      - OUTPUT_DIR=/harbor_shared
      - ASK_HUMAN_BACKEND=${ASK_HUMAN_BACKEND:-litellm_proxy}
      - ASK_HUMAN_MODEL=${ASK_HUMAN_MODEL:-openai/gpt-5.6}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
      - LITELLM_USER=${LITELLM_USER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',8000),timeout=2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  harbor-shared:
